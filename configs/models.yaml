models:
  default_vision_model: "xception_baseline"

  deep_learning:
    xception_baseline:
      architecture: "Xception"
      weights: "imagenet"
      include_top: false
      pooling: "avg"
      input_shape: [180, 180, 3]
      classes: 200
      freeze_backbone: true
      dropout_rate: 0.2
      path: "models/deep_learning/plant.h5"

    mobilenet_v3:
      architecture: "MobileNetV3Large"
      weights: "imagenet"
      include_top: false
      pooling: "avg"
      input_shape: [224, 224, 3]
      classes: 200
      dropout_rate: 0.3

    efficientnet_b0:
      architecture: "EfficientNetB0"
      weights: "imagenet"
      include_top: false
      pooling: "avg"
      input_shape: [224, 224, 3]
      classes: 200
      dropout_rate: 0.25

    tabular_mlp:
      input_dim: 7
      hidden_layers: [128, 64, 32]
      activation: "relu"
      dropout_rate: 0.2
      output_dim: 200

  classical:
    random_forest:
      n_estimators: 100
      max_depth: 15
      min_samples_split: 5
      random_state: 42
      n_jobs: -1

    gradient_boosting:
      n_estimators: 100
      learning_rate: 0.1
      max_depth: 5
      random_state: 42

    svm:
      kernel: "rbf"
      C: 1.0
      probability: true
      random_state: 42

    logistic_regression:
      penalty: "l2"
      C: 1.0
      max_iter: 1000
      random_state: 42

    kashmir_alpine_specialist:
      architecture: "MobileNetV3Large"
      weights: "imagenet"
      classes: 15
      input_shape: [224, 224, 3]
      dropout_rate: 0.3
      learning_rate: 0.0005
      path: "models/kashmir/kashmir_alpine.h5"
      species_list: "data/raw/clinical/Kashmere.csv"

  ensemble:
    voting_ensemble:
      voting: "soft"
      weights: [0.6, 0.2, 0.2]

    hierarchical_fusion:
      type: "multimodal_hierarchical"
      vision_weight: 0.70
      geographic_elevation_weight: 0.15
      agronomic_soil_weight: 0.15
      path: "models/fusion/hierarchical_fusion.h5"
